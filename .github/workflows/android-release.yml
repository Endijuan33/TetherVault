name: Android Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_NDK_VERSION: 27.2.12479018

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk
          key: ndk-${{ env.ANDROID_NDK_VERSION }}

      - name: Build tun2socks from source via NDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager "ndk;${ANDROID_NDK_VERSION}" > /dev/null

          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          export PATH="${ANDROID_NDK_HOME}:${PATH}"

          git clone --recursive https://github.com/heiher/hev-socks5-tunnel.git
          cd hev-socks5-tunnel

          # PKGNAME/CLSNAME must match hev.socks5.tunnel.Tun2Socks so
          # JNI_OnLoad's FindClass/RegisterNatives bind to our wrapper.
          ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk \
            APP_CFLAGS="-DPKGNAME=hev/socks5/tunnel -DCLSNAME=Tun2Socks" \
            APP_ABI="armeabi-v7a arm64-v8a" -j"$(nproc)"

          mkdir -p ../app/src/main/jniLibs/arm64-v8a ../app/src/main/jniLibs/armeabi-v7a
          cp libs/arm64-v8a/libhev-socks5-tunnel.so ../app/src/main/jniLibs/arm64-v8a/
          cp libs/armeabi-v7a/libhev-socks5-tunnel.so ../app/src/main/jniLibs/armeabi-v7a/

          echo "==> jniLibs ready:"
          ls -la ../app/src/main/jniLibs/*/

      - name: Build Debug and Release APKs
        run: |
          ./gradlew assembleDebug assembleRelease --stacktrace --no-daemon

      - name: Check APK contents
        shell: bash
        run: |
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            echo "==> $apk"
            unzip -l "$apk" | grep "lib/" || { echo "ERROR: no native libs in $apk"; exit 1; }
          done

      - name: Regenerate changelog
        run: ./scripts/generate-changelog.sh

      - name: Commit changelog and move tag
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: update changelog [skip ci]"
            # Best effort: main may have moved on since the tag was cut;
            # the changelog still ships with the release via the tag below.
            git push origin HEAD:refs/heads/main || echo "main advanced; changelog pushed with tag only"
          fi

          # Point the tag at the changelog commit so the release tree
          # contains the regenerated file.
          git tag -f "${GITHUB_REF_NAME}" HEAD
          git push -f origin "${GITHUB_REF_NAME}"

      - name: Extract release notes from changelog
        id: notes
        run: |
          # Emit the changelog section for this tag (falls back to the
          # whole file for manual dispatch runs).
          python3 - <<'EOF'
          import os, re, sys
          tag = os.environ["GITHUB_REF_NAME"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## \[{re.escape(tag)}\].*?(?=^## |\Z)", text, re.M | re.S)
          notes = m.group(0).strip() if m else text
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("notes<<EOF\n" + notes + "\nEOF\n")
          EOF

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TetherVault ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.notes }}
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tethervault-release-apks
          path: app/build/outputs/apk/**/*.apk
          retention-days: 90
          if-no-files-found: error
