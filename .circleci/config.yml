version: 2.1

# TetherVault CI pipeline: builds debug and release APKs.
# The tun2socks native library is compiled from source with the Android
# NDK on every run, so no .so files are stored in Git.

jobs:
  build:
    docker:
      - image: cimg/android:2024.01
    # Android + R8 + NDK builds are memory hungry. On the CircleCI free
    # plan, remove this line to fall back to the default `medium` class.
    resource_class: large
    environment:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      ANDROID_NDK_VERSION: 27.2.12479018
    steps:
      - checkout

      - restore_cache:
          name: Restore Gradle Cache
          keys:
            - gradle-v1-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
            - gradle-v1

      - run:
          name: Install Android SDK and NDK components
          command: |
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}" > /dev/null
          no_output_timeout: 15m

      - run:
          name: Build tun2socks from source via NDK
          command: |
            set -euo pipefail

            export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
            export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
            export PATH="${ANDROID_NDK_HOME}:${PATH}"

            git clone --recursive https://github.com/heiher/hev-socks5-tunnel.git
            cd hev-socks5-tunnel

            # Standalone Android.mk build: sources plus submodules
            # (lwip, yaml, hev-task-system) for the two device ABIs.
            # PKGNAME/CLSNAME must match hev.socks5.tunnel.Tun2Socks so
            # JNI_OnLoad's FindClass/RegisterNatives bind to our wrapper.
            ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk \
              APP_CFLAGS="-DPKGNAME=hev/socks5/tunnel -DCLSNAME=Tun2Socks" \
              APP_ABI="armeabi-v7a arm64-v8a" -j"$(nproc)"

            mkdir -p ../app/src/main/jniLibs/arm64-v8a ../app/src/main/jniLibs/armeabi-v7a
            cp libs/arm64-v8a/libhev-socks5-tunnel.so ../app/src/main/jniLibs/arm64-v8a/
            cp libs/armeabi-v7a/libhev-socks5-tunnel.so ../app/src/main/jniLibs/armeabi-v7a/

            echo "==> jniLibs ready:"
            ls -la ../app/src/main/jniLibs/*/
          no_output_timeout: 30m

      - run:
          name: Build Debug APK
          command: ./gradlew assembleDebug --stacktrace
          no_output_timeout: 20m

      - run:
          name: Build Release APK
          command: ./gradlew assembleRelease --stacktrace
          no_output_timeout: 20m

      - save_cache:
          name: Save Gradle Cache
          key: gradle-v1-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper

      - store_artifacts:
          name: Store APK Artifacts
          path: app/build/outputs/apk
          destination: apks

workflows:
  android-build:
    jobs:
      - build
