version: 2.1

# TetherVault CI pipeline: builds debug and release APKs.
# The tun2socks native libraries are downloaded at build time so the
# (potentially large) .so files never need to be committed to Git.

jobs:
  build:
    docker:
      - image: cimg/android:2024.01
    # Android + R8 builds are memory hungry. On the CircleCI free plan,
    # remove this line to fall back to the default `medium` class.
    resource_class: large
    environment:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - checkout

      - restore_cache:
          name: Restore Gradle Cache
          keys:
            - gradle-v1-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
            - gradle-v1

      - run:
          name: Install Android SDK components
          command: |
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - run:
          name: Download and Setup tun2socks
          command: |
            set -u

            ARM64_DIR="app/src/main/jniLibs/arm64-v8a"
            ARM32_DIR="app/src/main/jniLibs/armeabi-v7a"
            mkdir -p "$ARM64_DIR" "$ARM32_DIR"

            is_elf() {
              [ "$(head -c 4 "$1" | od -An -tx1 | tr -d ' \n')" = "7f454c46" ]
            }

            download_and_install() {
              local url="$1" dest_dir="$2" tmp_dir so_file
              tmp_dir="$(mktemp -d)"
              echo "  Downloading: $url"
              if ! curl -fsSL --retry 2 --connect-timeout 15 --max-time 300 -o "$tmp_dir/package" "$url"; then
                echo "  -> download failed"
                rm -rf "$tmp_dir"
                return 1
              fi
              case "$url" in
                *.tar.gz|*.tgz) tar -xzf "$tmp_dir/package" -C "$tmp_dir" ;;
                *.zip) unzip -qq -o "$tmp_dir/package" -d "$tmp_dir" ;;
              esac
              so_file="$(find "$tmp_dir" -name '*.so' -print -quit)"
              if [ -z "$so_file" ] && [ -s "$tmp_dir/package" ] && is_elf "$tmp_dir/package"; then
                so_file="$tmp_dir/package"
              fi
              if [ -n "$so_file" ]; then
                cp "$so_file" "$dest_dir/libtun2socks.so"
                echo "  -> installed $dest_dir/libtun2socks.so"
                rm -rf "$tmp_dir"
                return 0
              fi
              echo "  -> no shared object found in package"
              rm -rf "$tmp_dir"
              return 1
            }

            # The app catches UnsatisfiedLinkError at runtime, so a pipeline
            # never breaks because the real library is unavailable: a small
            # placeholder file keeps the build green instead.
            create_placeholder() {
              local dest="$1"
              echo "  -> WARNING: no usable prebuilt library found, creating placeholder $dest"
              printf 'TetherVault placeholder for libtun2socks.so\n' > "$dest"
            }

            # Point these at real prebuilt artifacts via CircleCI environment
            # variables once a library matching Tun2SocksJniWrapper is built:
            ARM64_URL="${TUN2SOCKS_ARM64_URL:-https://github.com/heiher/hev-socks5-tunnel/releases/latest/download/hev-socks5-tunnel-android-arm64.tar.gz}"
            ARM32_URL="${TUN2SOCKS_ARMV7_URL:-https://github.com/heiher/hev-socks5-tunnel/releases/latest/download/hev-socks5-tunnel-android-arm.tar.gz}"

            echo "==> arm64-v8a"
            download_and_install "$ARM64_URL" "$ARM64_DIR" \
              || create_placeholder "$ARM64_DIR/libtun2socks.so"

            echo "==> armeabi-v7a"
            download_and_install "$ARM32_URL" "$ARM32_DIR" \
              || create_placeholder "$ARM32_DIR/libtun2socks.so"

            echo "==> jniLibs ready:"
            find app/src/main/jniLibs -type f -exec ls -la {} \;

      - run:
          name: Build Debug APK
          command: ./gradlew assembleDebug --stacktrace
          no_output_timeout: 20m

      - run:
          name: Build Release APK
          command: ./gradlew assembleRelease --stacktrace
          no_output_timeout: 20m

      - save_cache:
          name: Save Gradle Cache
          key: gradle-v1-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper

      - store_artifacts:
          name: Store APK Artifacts
          path: app/build/outputs/apk
          destination: apks

workflows:
  android-build:
    jobs:
      - build
